services:
  agent-api:
    build:
      context: ./services/agent-api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////data/osma.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Empty key stays in guide mode and does not call this URL.
      # 127.0.0.1 inside the container is not Ollama on the host.
      # Optional host Ollama: set a non-empty key and
      # OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-llama3.2}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OSMA_WORKSPACE_ROOT: /workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - osma-data:/data
      - osma-workspaces:/workspaces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AGENT_API_URL: http://agent-api:8000
    depends_on:
      agent-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  osma-data:
  osma-workspaces:
